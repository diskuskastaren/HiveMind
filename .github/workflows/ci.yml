name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: supplier-notes

jobs:
  checks:
    name: Tests and end-to-end checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supplier-notes/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Playwright is used by the browser checks only and is not a project dependency. Installing
      # Chromium "with deps" also provides the system libraries Electron needs on a bare runner.
      - name: Install Playwright, Chromium dependencies and Xvfb
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Electron end-to-end checks
        run: xvfb-run -a node scripts/e2e-electron.cjs
      - name: Browser end-to-end checks
        run: node scripts/e2e-browser.mjs
      - name: Note editor end-to-end checks
        run: node scripts/e2e-editor.mjs

  windows:
    name: Windows end-to-end checks, installer and smoke test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supplier-notes/package-lock.json
      - run: npm ci
      - run: npm run build
      # Backups share unchanged files through NTFS hard links.
      - name: Storage tests
        run: node --test electron/storage.test.cjs
      # Same checks as on Linux, here against Windows' own key store (DPAPI) and screen capture.
      - name: Electron end-to-end checks
        run: node scripts/e2e-electron.cjs
      # Unsigned by design (see docs/RELEASING.md). Never publishes; releases are made manually.
      - run: npx electron-builder --win --publish never
      - name: Launch the packaged app (isolated profile)
        run: node scripts/smoke-electron.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: HiveMind-installer
          path: supplier-notes/release/HiveMind-Setup-*.exe
          retention-days: 7
          if-no-files-found: error
