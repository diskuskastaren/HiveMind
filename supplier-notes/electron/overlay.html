<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teams Meeting Detected</title>
  <style>
    /* Mirrors the app's "Calm workspace" tokens (src/index.css) — this window is plain HTML outside the React bundle */
    :root {
      --card: #ffffff;
      --border: #e4e4e7;
      --foreground: #18181b;
      --muted-foreground: #66666e;
      --accent: #ededf0;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-foreground: #ffffff;
      --recording: #dc2626;
      --shadow: 0 0 0 1px rgba(16, 24, 40, 0.04), 0 12px 32px rgba(16, 24, 40, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --card: #161618;
        --border: #27272a;
        --foreground: #fafafa;
        --muted-foreground: #a1a1aa;
        --accent: #232326;
        --primary: #818cf8;
        --primary-hover: #a5b4fc;
        --primary-foreground: #0b0b1e;
        --recording: #f87171;
        --shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Google Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      padding: 40px;
    }

    .pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      -webkit-app-region: drag;
    }

    /* ── Top row ── */
    .top-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 12px 12px 14px;
    }

    .app-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    .app-icon img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .app-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted-foreground);
      margin-bottom: 2px;
    }

    .app-name::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--recording);
    }

    .text {
      flex: 1;
      min-width: 0;
      -webkit-app-region: no-drag;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      color: var(--foreground);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted-foreground);
      margin-top: 1px;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .record-btn {
      background: var(--primary);
      color: var(--primary-foreground);
      border: none;
      border-radius: 8px;
      height: 32px;
      padding: 0 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      -webkit-app-region: no-drag;
    }

    .record-btn:hover {
      background: var(--primary-hover);
    }

    .record-btn:focus-visible,
    .dismiss-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .dismiss-btn {
      background: transparent;
      border: none;
      color: var(--muted-foreground);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
      padding: 0;
      -webkit-app-region: no-drag;
    }

    .dismiss-btn:hover {
      color: var(--foreground);
      background: var(--accent);
    }

    .dismiss-btn svg {
      width: 14px;
      height: 14px;
    }

    /* ── Consent row (hidden by default, expands on hover) ── */
    .consent-row {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.22s ease, padding 0.22s ease;
      padding: 0 14px;
      -webkit-app-region: no-drag;
    }

    .pill:hover .consent-row {
      max-height: 60px;
      padding: 0 14px 12px 14px;
    }

    .consent-text {
      font-size: 12px;
      color: var(--muted-foreground);
      line-height: 1.5;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="pill">
      <div class="top-row">
        <div class="app-icon">
          <img src="../dist/icon.png" alt="HiveMind" />
        </div>

        <div class="text">
          <div class="app-name">Teams meeting detected</div>
          <div class="title">Start Meeting Transcription</div>
          <div class="subtitle">Choose which note to record in</div>
        </div>

        <div class="actions">
          <button class="record-btn" id="recordBtn">Start recording</button>
          <button class="dismiss-btn" id="dismissBtn" title="Dismiss" aria-label="Dismiss">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="consent-row">
        <p class="consent-text">
          By starting, you confirm that you will collect consent from all meeting participants before transcribing.
        </p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('recordBtn').addEventListener('click', () => {
      window.electronOverlay.startRecording();
    });

    document.getElementById('dismissBtn').addEventListener('click', () => {
      window.electronOverlay.dismiss();
    });
  </script>
</body>
</html>
